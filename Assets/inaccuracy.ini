; Chameleon Console - per-era component inaccuracy (age / tolerance drift).
;
; UNIT: pct is a FRACTION in the range 0..1, where 1.0 = 100%.
;       (0.05 = 5%, 0.10 = 10%. It is NOT 0..100.)
;
; WHAT IT DOES: each plugin instance (channel) draws a unique random value in
; [-1, 1] and the per-era saturation coefficients are scaled by
; (1 + value * pct). The percentage is per era, so every channel of the same
; console drifts a little differently - like real analogue hardware.
; Set pct=0 to disable drift for an era.
;
; DEFAULTS: oriented on real-world component tolerances and age. Older / more
; coloured desks (aged transformers, carbon-film resistors, electrolytics,
; drifting tubes) get a higher pct; modern precision desks get a lower pct.
;
; Era names: neve api ssl isa mackie redd ua telefunken helios hybrid
;            rca detroit studer polar harrison trident mci

[neve]        ; 1970s Marinair/Carnhill transformers, carbon-film Rs
pct=0.06
[api]         ; 1970s blue/silver stripe, 2520 op-amps
pct=0.05
[ssl]         ; 1980s precision, tight components
pct=0.03
[isa]         ; 1985, good but not hand-matched
pct=0.04
[mackie]      ; 1990s solid-state, budget pots
pct=0.03
[redd]        ; 1960s, very aged, loose tolerances
pct=0.08
[ua]          ; 1960s UA custom, aged
pct=0.06
[telefunken]  ; 1960s V72, aged transformers/tubes
pct=0.07
[helios]      ; 1969, hand-built, aged
pct=0.07
[hybrid]      ; API in / Neve out, mixed
pct=0.05
[rca]         ; 1970s CBS/Columbia, aged
pct=0.07
[detroit]     ; Motown home-brew 12AX7 tube preamps, drifting
pct=0.08
[studer]      ; Swiss precision, ultra-clean
pct=0.02
[polar]       ; Scandinavian precision
pct=0.025
[harrison]    ; discrete, hand-matched, clean
pct=0.02
[trident]     ; A-Range, smooth discrete
pct=0.04
[mci]         ; studio standard, clean-tight
pct=0.04