; Chameleon Console - per-era component inaccuracy (age / tolerance drift).
;
; pct = fraction (0..1) of how much the component values may deviate.
; Each plugin instance (channel) draws a unique random value in [-1,1] and
; the saturation coefficients are scaled by (1 + value * pct). The percentage
; is per era, so every channel of the same console drifts differently - like
; real analogue hardware. Set pct=0 to disable drift for an era.
;
; Era names: neve api ssl isa mackie redd ua telefunken helios hybrid
;            rca detroit studer polar harrison trident mci

[neve]
pct=0.05
[api]
pct=0.05
[ssl]
pct=0.04
[isa]
pct=0.05
[mackie]
pct=0.02
[redd]
pct=0.06
[ua]
pct=0.05
[telefunken]
pct=0.05
[helios]
pct=0.06
[hybrid]
pct=0.05
[rca]
pct=0.06
[detroit]
pct=0.07
[studer]
pct=0.02
[polar]
pct=0.03
[harrison]
pct=0.02
[trident]
pct=0.04
[mci]
pct=0.05